name: JK Creator Lab Private Enquiries

on:
  # Run off the busy hour boundary; GitHub recommends avoiding minute 0.
  schedule:
    - cron: "2/5 * * * *"
  workflow_dispatch:
  # Run immediately when the bot code or this workflow is changed.
  push:
    paths:
      - "telegram_enquiry_bot.py"
      - ".github/workflows/private-enquiry-bot.yml"

permissions:
  contents: write

concurrency:
  group: jk-private-enquiries
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Process Telegram messages
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          JK_ADMIN_CHAT_ID: ${{ secrets.JK_ADMIN_CHAT_ID }}
        run: python telegram_enquiry_bot.py
      - name: Save update offset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update private enquiry bot offset"
            git push
          fi
